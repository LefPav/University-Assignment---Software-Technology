<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" crossorigin="anonymous">

    <title>Announce new Traineeship Position</title>

    <style>
        body {
            background-color: #f8f9fa;
        }

        .form-container {
            max-width: 600px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        h3 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            font-weight: 600;
            margin-top: 15px;
        }

        button {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container form-container">

    <h3>Announce New Traineeship Position</h3>

    <form th:action="@{/company/addTraineeshipPosition}" th:object="${traineeshipPosition}" method="post">
        <div class="form-group">
            <label>Start Date</label>
            <input type="date" class="form-control" th:field="*{traineeship_startDate}" />
        </div>

        <div class="form-group">
            <label>End Date</label>
            <input type="date" class="form-control" th:field="*{traineeship_endDate}" />
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea class="form-control" rows="4" th:field="*{traineeship_description}"></textarea>
        </div>

        <div class="form-group">
            <label>Topics</label>
            <input type="text" class="form-control" th:field="*{traineeship_topics}" />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Submit</button>
    </form>

</div>

</body>
</html>
