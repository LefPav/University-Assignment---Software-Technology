<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">

	<title>List of students who applied for Traineeship positions</title>
</head>

<body>

<div class="container">

	<h3>List of students who applied for a traineeship position</h3>
	<hr>
	
	
	<table class="table table-bordered table-striped">
		<thead class="thead-dark">
			<tr>
				<th>Student name</th>
		</thead>
		
		<tbody>
			<tr th:each="applicants : ${applicants}">
			
				<td th:text="${applicants.studentName}" />			
				
			</tr>
		</tbody>		
	</table>
	
	<a th:href="@{/committee/committee-homepage}">Back to homepage</a>
	
</div>
	
</body>
</html>
